# Local development stack. Two ways to use it:
#
#   make dev-deps   Postgres + Redis only — pair with `npm run start:dev` on the
#                   host, which is the faster loop and what the README assumes.
#   make dev        The app in a container too, hot-reloading from ./src.
#
# Ports and volume names match the stack this replaced, so an existing local
# database is picked up rather than orphaned.
services:
  app:
    build:
      context: .
      target: builder
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      # Source mounted for hot reload; everything else the compiler needs is
      # read-only because nothing should be writing to it.
      - ./src:/app/src:delegated
      - ./nest-cli.json:/app/nest-cli.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.build.json:/app/tsconfig.build.json:ro
      # The builder image stops before the runtime stage's `COPY assets`, so
      # without this mount the placeholder item photo 404s in local dev.
      - ./assets:/app/assets:ro
      # Item photography, shared with the host so the derivatives the import
      # writes survive a rebuild. Without it the media lives in the container's
      # own writable layer: invisible to host-side tooling, and lost on every
      # rebuild, leaving every item row pointing at a missing digest.
      - ./.media:/var/lib/cashortrash/media
    command: ['npx', 'nest', 'start', '--watch']
    env_file:
      - .env
    environment:
      # Database settings are owned by compose, not .env: the database is
      # reachable only on the compose network, so the credentials are plain
      # and the same in every environment.
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: cashortrash
      DATABASE_PASSWORD: cashortrash
      DATABASE_NAME: cashortrash
      DATABASE_SSL: 'false'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # The host writes to ./.media; in here that same directory is mounted at
      # the absolute path the app defaults to.
      MEDIA_ROOT: /var/lib/cashortrash/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: cashortrash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cashortrash
      POSTGRES_PASSWORD: cashortrash
      POSTGRES_DB: cashortrash
    ports:
      - '5432:5432'
    volumes:
      - cashortrash-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cashortrash -d cashortrash']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cashortrash-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - cashortrash-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cashortrash-pgdata:
  cashortrash-redisdata:
